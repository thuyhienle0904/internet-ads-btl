<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Internet Ads inference and evaluation pipeline</title>
  <desc id="desc">Group-aware split, five grouped cross-validation runs with one validation fold per run, out-of-fold evaluation and threshold selection, final training, then a separate held-out test.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #24384d; }
      .title { font-size: 42px; font-weight: 700; letter-spacing: -.5px; }
      .stage { font-size: 26px; font-weight: 700; }
      .label { font-size: 23px; }
      .small { font-size: 22px; fill: #52677c; }
      .foldhead { font-size: 22px; font-weight: 700; fill: #52677c; }
      .run { font-size: 22px; fill: #52677c; }
      .rule { stroke: #d8e1e8; stroke-width: 2; }
      .flow { fill: none; stroke: #3d5267; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .testflow { fill: none; stroke: #d5894a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#orangeArrow); }
      .fit { fill: #729ec4; stroke: #4f7da7; stroke-width: 1.3; }
      .val { fill: #72bcae; stroke: #3e9e91; stroke-width: 1.3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3d5267"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d5894a"/></marker>
    <symbol id="database" viewBox="0 0 90 100">
      <ellipse cx="45" cy="15" rx="37" ry="12" fill="#e7f0f8" stroke="#365c7c" stroke-width="3"/>
      <path d="M8 15v56c0 17 74 17 74 0V15 M8 35c0 17 74 17 74 0 M8 54c0 17 74 17 74 0" fill="none" stroke="#365c7c" stroke-width="3"/>
    </symbol>
    <symbol id="model" viewBox="0 0 100 100">
      <circle cx="15" cy="50" r="7" fill="#4f83aa"/>
      <circle cx="49" cy="21" r="7" fill="#4f83aa"/>
      <circle cx="49" cy="79" r="7" fill="#4f83aa"/>
      <circle cx="85" cy="50" r="7" fill="#4f83aa"/>
      <path d="M21 46 43 25 M21 54 43 75 M55 25 79 46 M55 75 79 54" stroke="#4f83aa" stroke-width="3" fill="none"/>
    </symbol>
  </defs>

  <rect width="1800" height="1000" fill="#ffffff"/>
  <text class="title" x="96" y="100">Inference → Evaluation → Test</text>
  <line class="rule" x1="96" y1="150" x2="1704" y2="150"/>

  <!-- Input and group split. -->
  <use href="#database" x="105" y="307" width="90" height="100"/>
  <text class="stage" x="150" y="446" text-anchor="middle">Dataset</text>
  <path class="flow" d="M206 353 H278"/>
  <circle cx="306" cy="353" r="23" fill="#fff" stroke="#4c6680" stroke-width="2.5"/>
  <path d="M295 353h22 M306 342v22" stroke="#4c6680" stroke-width="2.5"/>
  <text class="stage" x="306" y="240" text-anchor="middle">Group split</text>
  <path class="flow" d="M329 342 H464"/>
  <text class="label" x="394" y="328" text-anchor="middle" fill="#346f9d">80% train</text>
  <path class="testflow" d="M306 377 V887 H1160 V718 H1228"/>
  <text class="label" x="333" y="848" fill="#bd7135">20% held-out test</text>

  <!-- Actual five-fold rotation. Each row trains on four folds and validates on one. -->
  <text class="stage" x="538" y="217">Grouped 5-fold CV</text>
  <text class="foldhead" x="603" y="292" text-anchor="middle">F1</text>
  <text class="foldhead" x="675" y="292" text-anchor="middle">F2</text>
  <text class="foldhead" x="747" y="292" text-anchor="middle">F3</text>
  <text class="foldhead" x="819" y="292" text-anchor="middle">F4</text>
  <text class="foldhead" x="891" y="292" text-anchor="middle">F5</text>
  <text class="run" x="550" y="333" text-anchor="end">1</text>
  <text class="run" x="550" y="393" text-anchor="end">2</text>
  <text class="run" x="550" y="453" text-anchor="end">3</text>
  <text class="run" x="550" y="513" text-anchor="end">4</text>
  <text class="run" x="550" y="573" text-anchor="end">5</text>
  <g>
    <rect class="val" x="570" y="306" width="66" height="40" rx="2"/><rect class="fit" x="642" y="306" width="66" height="40" rx="2"/><rect class="fit" x="714" y="306" width="66" height="40" rx="2"/><rect class="fit" x="786" y="306" width="66" height="40" rx="2"/><rect class="fit" x="858" y="306" width="66" height="40" rx="2"/>
    <rect class="fit" x="570" y="366" width="66" height="40" rx="2"/><rect class="val" x="642" y="366" width="66" height="40" rx="2"/><rect class="fit" x="714" y="366" width="66" height="40" rx="2"/><rect class="fit" x="786" y="366" width="66" height="40" rx="2"/><rect class="fit" x="858" y="366" width="66" height="40" rx="2"/>
    <rect class="fit" x="570" y="426" width="66" height="40" rx="2"/><rect class="fit" x="642" y="426" width="66" height="40" rx="2"/><rect class="val" x="714" y="426" width="66" height="40" rx="2"/><rect class="fit" x="786" y="426" width="66" height="40" rx="2"/><rect class="fit" x="858" y="426" width="66" height="40" rx="2"/>
    <rect class="fit" x="570" y="486" width="66" height="40" rx="2"/><rect class="fit" x="642" y="486" width="66" height="40" rx="2"/><rect class="fit" x="714" y="486" width="66" height="40" rx="2"/><rect class="val" x="786" y="486" width="66" height="40" rx="2"/><rect class="fit" x="858" y="486" width="66" height="40" rx="2"/>
    <rect class="fit" x="570" y="546" width="66" height="40" rx="2"/><rect class="fit" x="642" y="546" width="66" height="40" rx="2"/><rect class="fit" x="714" y="546" width="66" height="40" rx="2"/><rect class="fit" x="786" y="546" width="66" height="40" rx="2"/><rect class="val" x="858" y="546" width="66" height="40" rx="2"/>
  </g>
  <rect class="fit" x="571" y="622" width="27" height="17" rx="1"/><text class="small" x="608" y="637">fit on four folds</text>
  <rect class="val" x="771" y="622" width="27" height="17" rx="1"/><text class="small" x="808" y="637">validate on one fold</text>

  <!-- Evaluation on train-only out-of-fold scores. -->
  <path class="flow" d="M948 446 H1046"/>
  <g transform="translate(1064 341)">
    <line x1="0" y1="97" x2="112" y2="97" stroke="#8ba0b1" stroke-width="2"/>
    <circle cx="14" cy="70" r="7" fill="#72bcae"/><circle cx="33" cy="46" r="7" fill="#72bcae"/><circle cx="52" cy="75" r="7" fill="#72bcae"/><circle cx="71" cy="34" r="7" fill="#72bcae"/><circle cx="90" cy="58" r="7" fill="#72bcae"/>
  </g>
  <text class="stage" x="1118" y="486" text-anchor="middle">OOF evaluation</text>
  <path class="flow" d="M1197 446 H1280"/>
  <g transform="translate(1310 350)">
    <path d="M0 87H114 M0 87V0" fill="none" stroke="#8ba0b1" stroke-width="2"/>
    <path d="M8 21 35 32 48 45 64 51 78 72 108 79" fill="none" stroke="#3f9d92" stroke-width="3"/>
    <line x1="0" y1="53" x2="114" y2="53" stroke="#c7aa82" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="64" cy="51" r="5.5" fill="#d5894a"/>
  </g>
  <text class="stage" x="1365" y="486" text-anchor="middle">Threshold</text>
  <text class="small" x="1365" y="520" text-anchor="middle">precision ≥ 0.70</text>
  <path class="flow" d="M1451 446 H1514"/>
  <use href="#model" x="1535" y="351" width="100" height="100"/>
  <text class="stage" x="1585" y="486" text-anchor="middle">Refit on train</text>

  <!-- The final test is reached only after OOF evaluation and full-data refitting. -->
  <path class="flow" d="M1585 530 V608 H1300 V646"/>
  <line class="rule" x1="1060" y1="598" x2="1705" y2="598"/>
  <rect x="1231" y="666" width="138" height="104" rx="3" fill="#fff4e9" stroke="#d5894a" stroke-width="2"/>
  <path d="M1289 708v-9a12 12 0 0 1 24 0v9 M1286 708h30v28h-30z" fill="none" stroke="#bc7136" stroke-width="3"/>
  <text class="stage" x="1300" y="805" text-anchor="middle">Held-out test</text>
  <path class="flow" d="M1372 718 H1584"/>
  <g transform="translate(1600 680)" stroke="#4e827b" stroke-width="3" fill="none">
    <path d="M0 68V0 M0 68H80"/><path d="M10 51 30 37 49 44 70 13"/><circle cx="10" cy="51" r="3" fill="#4e827b"/><circle cx="30" cy="37" r="3" fill="#4e827b"/><circle cx="49" cy="44" r="3" fill="#4e827b"/><circle cx="70" cy="13" r="3" fill="#4e827b"/>
  </g>
  <text class="stage" x="1640" y="805" text-anchor="middle">Evaluation metrics</text>
  <text class="small" x="1640" y="843" text-anchor="middle">Precision · Recall · F₂</text>
  <text class="small" x="1640" y="875" text-anchor="middle">Accuracy · Average precision</text>
  <text class="small" x="1640" y="907" text-anchor="middle">ROC-AUC · Confusion matrix</text>

</svg>
